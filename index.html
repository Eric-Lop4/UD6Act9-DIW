<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Javi Signes" />
    <title>Red Plane</title>
    <script src="js/scripts.js"></script>
    <script src="https://kit.fontawesome.com/d52cedfaa5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/estils.css" />
</head>

<body onload="docReady()">
    <header>
        <div class="marcador"></div>
    </header>
    <main>
        <!-- avió -->
        <div id="avio"></div>
        <!-- botons -->
        <div id="botons">
            <a class="menu_inf" href="#modalAjuda">Ajuda</a>
            <button class="menu_inf" id="nivell1">Nivell 1</button>
            <button class="menu_inf" id="nivell2">Nivell 2</button>
        </div>

        <!-- Finestra modal d'ajuda -->
        <div id="modalAjuda" class="modalmask">
            <div class="modalbox rotate">
                <h2 id="titol_ajuda">AJUDA</h2>
                <a href="#" class="close">X</a>
                <ul class="text_ajuda">
                    <li><i class="fa-solid fa-arrow-left"></i><span>Esquerra</span></li>
                    <li><i class="fa-solid fa-arrow-right"></i><span>Dreta</span></li>
                    <li><i class="fa-solid fa-arrow-up"></i><span>Amunt</span></li>
                    <li><i class="fa-solid fa-arrow-down"></i><span>Avall</span></li>
                </ul>
                <p><strong>1:</strong> Parar/Activar so</p>
            </div>
        </div>
    </main>
</body>

</html>
